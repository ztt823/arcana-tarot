}
let hands=null,mpCamera=null,stream=null;
async function startCamera(){try{if(!navigator.mediaDevices?.getUserMedia)throw Error('浏览器不支持摄像头');const video=$('video');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:640,height:480},audio:false});video.srcObject=stream;$('cameraBox').style.display='block';if(!window.Hands||!window.Camera)throw Error('MediaPipe 脚本加载失败');hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:.65,minTrackingConfidence:.6});hands.onResults(res=>{if(mode!=='gesture')return;const lm=res.multiHandLandmarks?.[0];if(lm){const g=gesture(lm);handleGesture(g,lm)}else{gestureCandidate='';lastGesture='NEUTRAL'}});mpCamera=new Camera(video,{onFrame:async()=>{if(hands)await hands.send({image:video})},width:640,height:480});mpCamera.start();$('cameraBtn').textContent='关闭摄像头';say('摄像头已开启 · 请让手掌进入画面')}catch(e){console.warn(e);setMode('mouse');say('摄像头权限或加载失败，已自动切换鼠标模式');toast.style.display='block';toast.textContent='摄像头无法启动，已切换为鼠标模式。请允许浏览器摄像头权限，或直接使用鼠标。';setTimeout(()=>toast.style.display='none',3500)}}
function stopCamera(){if(mpCamera?.stop)mpCamera.stop();if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;hands=null;$('cameraBox').style.display='none';$('cameraBtn').textContent='开启摄像头'}
$('cameraBtn').onclick=()=>stream?stopCamera():startCamera();
function animate(){requestAnimationFrame(animate);const t=performance.now()*.001;stars.rotation.y=Math.sin(t*.08)*.08;stars.rotation.x=Math.sin(t*.06)*.025;deck.forEach((g,i)=>{if(g!==current){g.position.y=g.userData.baseY+Math.sin(t*1.2+i*.2)*.012}});if(current&&held&&mode==='gesture'){current.rotation.y=Math.sin(t*.5)*.04}particles.forEach((p,i)=>{p.life+=.012;p.mat.uniforms.uTime.value=Math.min(1,p.life);if(p.life>=1){scene.remove(p.pts);p.pts.geometry.dispose();p.mat.dispose();particles.splice(i,1)}});renderer.render(scene,camera)}
animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
say('等待你的手势 · OPEN 张开手掌开始'); 
})();
</script>
